name: Build SoulCardMaster4 v41 Full ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoulCardMaster4_arm64_port_v41.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v41
        run: |
          rm -rf project
          mkdir -p project

          unzip -q SoulCardMaster4_arm64_port_v41.zip -d project

          echo "===== PROJECT ====="
          ls -la project

      - name: Fix Bitmap API
        run: |
          sed -i 's/Bitmap.createBitmap(data, 2, w, h, Bitmap.Config.ARGB_8888)/Bitmap.createBitmap(data, 2, w, w, h, Bitmap.Config.ARGB_8888)/' \
            project/app/src/main/java/com/soulcardmaster4/port/MainActivity.java

          echo "===== BITMAP API ====="

          grep -n "createBitmap" \
            project/app/src/main/java/com/soulcardmaster4/port/MainActivity.java

      - name: Fetch LZMA SDK
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y p7zip-full

          mkdir -p project/third_party/lzma

          echo "===== DOWNLOAD LZMA SDK ====="

          curl -fL \
            "https://www.7-zip.org/a/lzma2603.7z" \
            -o /tmp/lzma2603.7z

          echo "===== EXTRACT LZMA SDK ====="

          rm -rf /tmp/lzma2603-sdk
          mkdir -p /tmp/lzma2603-sdk

          7z x -y \
            -o/tmp/lzma2603-sdk \
            /tmp/lzma2603.7z

          echo "===== COPY LZMA FILES ====="

          cp /tmp/lzma2603-sdk/C/LzmaDec.c \
            project/third_party/lzma/LzmaDec.c

          cp /tmp/lzma2603-sdk/C/LzmaDec.h \
            project/third_party/lzma/LzmaDec.h

          cp /tmp/lzma2603-sdk/C/7zTypes.h \
            project/third_party/lzma/7zTypes.h

          cp /tmp/lzma2603-sdk/C/Precomp.h \
            project/third_party/lzma/Precomp.h

          cp /tmp/lzma2603-sdk/C/Compiler.h \
            project/third_party/lzma/Compiler.h

          echo "===== LZMA SDK FILES ====="

          ls -lh project/third_party/lzma

      - name: Fix Native Sources
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import
