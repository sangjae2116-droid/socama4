name: Build SoulCardMaster4 v41 Full ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoulCardMaster4_arm64_port_v41.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Extract v41
      # ============================================================

      - name: Extract v41
        run: |
          rm -rf project
          mkdir -p project
          unzip -q SoulCardMaster4_arm64_port_v41.zip -d project

          echo "===== PROJECT ROOT ====="
          ls -la project


      # ============================================================
      # 3. Fix Bitmap API
      # ============================================================

      - name: Fix Bitmap API
        run: |
          sed -i \
            's/Bitmap.createBitmap(data, 2, w, h, Bitmap.Config.ARGB_8888)/Bitmap.createBitmap(data, 2, w, w, h, Bitmap.Config.ARGB_8888)/' \
            project/app/src/main/java/com/soulcardmaster4/port/MainActivity.java

          echo "===== BITMAP API CHECK ====="
          grep -n "createBitmap" \
            project/app/src/main/java/com/soulcardmaster4/port/MainActivity.java


      # ============================================================
      # 4. Fetch official 7-Zip LZMA SDK
      # ============================================================

      - name: Fetch official 7-Zip LZMA SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

          mkdir -p project/third_party/lzma

          curl -fL \
            https://www.7-zip.org/a/lzma2603.7z \
            -o /tmp/lzma2603.7z

          rm -rf /tmp/lzma2603-sdk
          mkdir -p /tmp/lzma2603-sdk

          7z x \
            -y \
            -o/tmp/lzma2603-sdk \
            /tmp/lzma2603.7z >/dev/null

          for f in \
            LzmaDec.c \
            LzmaDec.h \
            7zTypes.h \
            Precomp.h \
            Compiler.h
          do
            test -f "/tmp/lzma2603-sdk/C/$f"

            cp \
              "/tmp/lzma2603-sdk/C/$f" \
              "project/third_party/lzma/$f"
          done

          echo "===== LZMA
