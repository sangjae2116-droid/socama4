name: Build SoulCardMaster4 v41 Full ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoulCardMaster4_arm64_port_v41.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Extract v41
        run: |
          rm -rf project
          mkdir -p project
          unzip -q SoulCardMaster4_arm64_port_v41.zip -d project


      - name: Fix Bitmap API
        run: |
          sed -i \
            's/Bitmap.createBitmap(data, 2, w, h, Bitmap.Config.ARGB_8888)/Bitmap.createBitmap(data, 2, w, w, h, Bitmap.Config.ARGB_8888)/' \
            project/app/src/main/java/com/soulcardmaster4/port/MainActivity.java


      - name: Fetch official 7-Zip LZMA SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

          mkdir -p project/third_party/lzma

          curl -fL \
            https://www.7-zip.org/a/lzma2603.7z \
            -o /tmp/lzma2603.7z

          rm -rf /tmp/lzma2603-sdk
          mkdir -p /tmp/lzma2603-sdk

          7z x -y \
            -o/tmp/lzma2603-sdk \
            /tmp/lzma2603.7z >/dev/null

          for f in LzmaDec.c LzmaDec.h 7zTypes.h Precomp.h Compiler.h; do
            test -f "/tmp/lzma2603-sdk/C/$f"
            cp \
              "/tmp/lzma2603-sdk/C/$f" \
              "project/third_party/lzma/$f"
          done

          echo "===== LZMA SDK FILES ====="
          ls -lh project/third_party/lzma


      - name: Fix Full Native Sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("project/app/src/main/cpp")

          # ------------------------------------------------------------
          # Fix scm_lzma_backend.cpp
          #
          # Actual source from v41:
          #
          # void *SzAlloc(void *, size_t size)
          # void SzFree(void *, void *address)
          #
          # Official 7-Zip ISzAlloc requires:
          #
          # void *(*Alloc)(ISzAllocPtr, size_t)
          # void (*Free)(ISzAllocPtr, void *)
          # ------------------------------------------------------------

          p = root / "scm_lzma_backend.cpp"
          s = p.read_text()

          print("===== BEFORE LZMA ALLOCATOR =====")
          for line in s.splitlines():
              if "SzAlloc" in line or "SzFree" in line or "g_Alloc" in line:
                  print(line)

          # Handle unnamed first parameter.
          s, n1 = re.subn(
              r'\bvoid\s*\*\s*SzAlloc\s*\(\s*void\s*\*',
              'void *SzAlloc(ISzAllocPtr',
              s,
              count=1
          )

          s, n2 = re.subn(
              r'\bvoid\s+SzFree\s*\(\s*void\s*\*',
              'void SzFree(ISzAllocPtr',
              s,
              count=1
          )

          # Also handle named-parameter variants just in case.
          if n1 == 0:
              s, n1 = re.subn(
                  r'\bvoid\s*\*\s+SzAlloc\s*\(\s*void\s*\*\s*[A-Za-z_]\w*',
                  'void *SzAlloc(ISzAllocPtr',
                  s,
                  count=1
              )

          if n2 == 0:
              s, n2 = re.subn(
                  r'\bvoid\s+SzFree\s*\(\s*void\s*\*\s*[A-Za-z_]\w*',
                  'void SzFree(ISzAllocPtr',
                  s,
                  count=1
              )

          if n1 != 1:
              raise SystemExit(
                  "ERROR: SzAlloc signature was not patched"
              )

          if n2 != 1:
              raise SystemExit(
                  "ERROR: SzFree signature was not patched"
              )

          p.write_text(s)

          print("===== AFTER LZMA ALLOCATOR =====")
          for line in s.splitlines():
              if "SzAlloc" in line or "SzFree" in line or "g_Alloc" in line:
                  print(line)

          # ------------------------------------------------------------
          # Fix native_bridge.cpp duplicate std::string err declaration.
          # Keep the first declaration and remove later duplicates.
          # ------------------------------------------------------------

          p = root / "native_bridge.cpp"
          s = p.read_text()

          lines = s.splitlines(True)
          seen = 0
          out = []

          for line in lines:
              if line.strip() == "std::string err;":
                  seen += 1
                  if seen > 1:
                      continue
              out.append(line)

          p.write_text("".join(out))

          print("===== native_bridge.cpp err declarations =====")
          for i, line in enumerate(out, 1):
              if "std::string err;" in line:
                  print(f"{i}: {line.rstrip()}")

          if seen == 0:
              print("WARNING: no std::string err declaration found")
          else:
              print(f"Found {seen} err declaration(s); kept first one")

          # ------------------------------------------------------------
          # Final sanity check.
          # ------------------------------------------------------------

          s = (root / "scm_lzma_backend.cpp").read_text()

          if "void *SzAlloc(ISzAllocPtr" not in s:
              raise SystemExit(
                  "ERROR: final SzAlloc signature is incorrect"
              )

          if "void SzFree(ISzAllocPtr" not in s:
              raise SystemExit(
                  "ERROR: final SzFree signature is incorrect"
              )

          print("===== FINAL LZMA SIGNATURE CHECK: OK =====")


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" \
                      "build-tools;35.0.0"


      - name: Build Full ARM64 APK
        working-directory: project
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== BUILD FULL ARM64 ====="

          gradle \
            --no-daemon \
            --stacktrace \
            -PscmPreviewOnly=false \
            assembleDebug


      - name: Verify Full APK
        working-directory: project
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "===== APK ====="
          ls -lh "$APK"

          echo "===== APK CONTENT CHECK ====="
          unzip -l "$APK" | grep "lib/arm64-v8a/libscm_arm64.so"
          unzip -l "$APK" | grep "assets/res.dat"

          echo "===== SHA256 ====="
          sha256sum "$APK"

          echo "===== FULL APK VERIFICATION: OK ====="


      - name: Upload Full ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulCardMaster4-v41-full-arm64-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
