name: Build SoulCardMaster4 v41

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoulCardMaster4_arm64_port_v41.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract v41
        run: |
          rm -rf project
          mkdir project
          unzip -q SoulCardMaster4_arm64_port_v41.zip -d project
          find project -maxdepth 3 -type f | head -100

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: test -f project/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoulCardMaster4-v41-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
