name: Build SoulCardMaster4 ARM64 + Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoulCardMaster4_arm64_port_v41.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q SoulCardMaster4_arm64_port_v41.zip -d project

      - name: Fix Bitmap API
        run: |
          set -e
          FILE="project/app/src/main/java/com/soulcardmaster4/port/MainActivity.java"
          sed -i 's/Bitmap.createBitmap(data, 2, w, h, Bitmap.Config.ARGB_8888)/Bitmap.createBitmap(data, 2, w, w, h, Bitmap.Config.ARGB_8888)/' "$FILE"

      - name: Fetch LZMA SDK
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y p7zip-full

          mkdir -p project/third_party/lzma

          curl -fL "https://www.7-zip.org/a/lzma2603.7z" \
            -o /tmp/lzma2603.7z

          rm -rf /tmp/lzma2603-sdk
          mkdir -p /tmp/lzma2603-sdk

          7z x -y \
            -o/tmp/lzma2603-sdk \
            /tmp/lzma2603.7z

          cp /tmp/lzma2603-sdk/C/LzmaDec.c \
            project/third_party/lzma/LzmaDec.c

          cp /tmp/lzma2603-sdk/C/LzmaDec.h \
            project/third_party/lzma/LzmaDec.h

          cp /tmp/lzma2603-sdk/C/7zTypes.h \
            project/third_party/lzma/7zTypes.h

          cp /tmp/lzma2603-sdk/C/Precomp.h \
            project/third_party/lzma/Precomp.h

          cp /tmp/lzma2603-sdk/C/Compiler.h \
            project/third_party/lzma/Compiler.h

      - name: Fix Native Sources
        run: |
          set -e

          LZMA_FILE="project/app/src/main/cpp/scm_lzma_backend.cpp"
          BRIDGE_FILE="project/app/src/main/cpp/native_bridge.cpp"

          sed -i \
            's/void \*SzAlloc(void \*, size_t size)/void *SzAlloc(ISzAllocPtr, size_t size)/' \
            "$LZMA_FILE"

          sed -i \
            's/void SzFree(void \*, void \*address)/void SzFree(ISzAllocPtr, void *address)/' \
            "$LZMA_FILE"

          sed -i '0,/std::string err;/!{/std::string err;/d;}' \
            "$BRIDGE_FILE"

      - name: Verify Native Sources
        run: |
          set -e

          grep -n "SzAlloc" \
            project/app/src/main/cpp/scm_lzma_backend.cpp

          grep -n "SzFree" \
            project/app/src/main/cpp/scm_lzma_backend.cpp

          grep -n "std::string err;" \
            project/app/src/main/cpp/native_bridge.cpp

          test -f project/third_party/lzma/LzmaDec.c
          test -f project/third_party/lzma/LzmaDec.h
          test -f project/third_party/lzma/7zTypes.h
          test -f project/third_party/lzma/Precomp.h
          test -f project/third_party/lzma/Compiler.h

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        run: |
          set -e

          if [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "$ANDROID_HOME" ] && \
               [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "$ANDROID_SDK_ROOT" ] && \
               [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found"
            exit 1
          fi

          SDK_ROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          test -d "$SDK_ROOT/ndk/27.3.13750724"

      - name: Build Full ARM64 APK
        working-directory: project
        run: |
          set -e

          test -d "$ANDROID_HOME/ndk/27.3.13750724"

          gradle \
            --no-daemon \
            --stacktrace \
            -PscmPreviewOnly=false \
            assembleDebug

      - name: Verify Full APK
        working-directory: project
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

          unzip -l "$APK" | grep \
            "lib/arm64-v8a/libscm_arm64.so"

          unzip -l "$APK" | grep \
            "assets/res.dat"

          sha256sum "$APK"

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulCardMaster4-arm64-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          TAG="arm64-build-${GITHUB_RUN_ID}"

          gh release create "$TAG" \
            "$APK#SoulCardMaster4-arm64-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SoulCardMaster4 ARM64 build #${GITHUB_RUN_NUMBER}" \
            --notes "Automated ARM64 debug APK build. GitHub Actions run #${GITHUB_RUN_NUMBER}."

          echo "===== RELEASE CREATED ====="
          echo "TAG=$TAG"
